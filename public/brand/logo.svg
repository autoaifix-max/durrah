<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1664" height="2080" viewBox="0 0 1664 2080" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">درة العنب — طازج يومياً</title>
  <desc id="logo-description">نسخة متجهية من الشعار المنقح المعتمد في المهمة، مؤلفة من مسارات مغلقة بألوان RGB ثابتة؛ الكتابة محولة إلى مسارات، دون صور مضمّنة أو خطوط خارجية. المطابقة مع الهوية الأصلية وألوان الطباعة تحتاج اعتماد صاحب العلامة والمطبعة.</desc>
  <metadata>Source: durrat-al-enab-logo-clean.png; vector tracing: Potrace 1.16; palette: white #FFFFFF, green #028954, lime #ACDA3E; transparent background; outlined lettering; no embedded raster content.</metadata>
